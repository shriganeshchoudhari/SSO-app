apiVersion: v1
kind: ConfigMap
metadata:
  name: openidentity-config
  namespace: openidentity
data:
  HTTP_PORT: "7070"
  DB_KIND: "postgresql"
  SESSION_IDLE_TIMEOUT_SECONDS: "1800"
  REDIS_URL: "redis://openidentity-redis:6379"
  OPENIDENTITY_RATE_LIMIT_REDIS_ENABLED: "true"
  OPENIDENTITY_REDIS_HEALTH_ENABLED: "true"
