{{- if .Values.alerts.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "openidentity.fullname" . }}-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openidentity.labels" . | nindent 4 }}
spec:
  groups:
    - name: openidentity
      rules:
        - alert: OpenIdentityHighLoginFailures
          expr: sum(rate(openidentity_auth_login_total{outcome="failure"}[5m])) * 60 > 20
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: OpenIdentity login failures are elevated
            description: Login failures have exceeded 20 per minute for 10 minutes.
        - alert: OpenIdentityBrokerFlowErrors
          expr: sum(rate(openidentity_broker_flow_total{outcome="error"}[5m])) * 60 > 5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: OpenIdentity broker errors are elevated
            description: OIDC or SAML broker flow errors have exceeded 5 per minute for 10 minutes.
        - alert: OpenIdentitySigningKeyStale
          expr: openidentity_key_age_hours > 2160
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: OpenIdentity signing key is older than 90 days
            description: The active JWT signing key age exceeds the expected rotation window.
        - alert: OpenIdentityHighTokenGrantLatencyP99
          expr: histogram_quantile(0.99, sum by (grant_type, le) (rate(openidentity_token_grant_latency_seconds_bucket[5m]))) > 2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: OpenIdentity token latency p99 is elevated
            description: Token grant latency p99 is above 2 seconds for 10 minutes.
{{- end }}
